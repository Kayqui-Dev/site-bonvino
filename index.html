<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonvino e Pereira Advocacia | Defesa Jurídica de Excelência</title>
    <meta name="description" content="Escritório de advocacia premium na Av. Paulista, São Paulo. Atendimento personalizado em Direito Civil, Trabalhista, Criminal, Família, Empresarial e Consumidor." />
    
    <!-- Google Fonts: Inter, Playfair Display, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-navy text-ivory antialiased selection:bg-platinum selection:text-navy min-h-screen relative overflow-x-hidden">
    <!-- SVG Noise Overlay (Preset B - 0.05 Opacity Noise) -->
    <div class="fixed inset-0 pointer-events-none z-[999] opacity-[0.05] mix-blend-overlay">
      <svg class="w-full h-full">
        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)" />
      </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
